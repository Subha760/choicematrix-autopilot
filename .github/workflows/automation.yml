name: Mixed Content Social Autopilot
on:
  schedule:
    # About twice hourly, off the :00 high-load period; times are best-effort UTC.
    - cron: '13,43 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: social-autopilot-state
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate draft / process owner approval / publish approved content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_APPROVER_ID: ${{ secrets.TG_APPROVER_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v21.0' }}
        run: python autopilot.py
      - name: Commit non-secret state and artwork
        id: persist
        if: always()
        shell: bash
        run: |
          git config user.name 'social-autopilot[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state docs/posts
          if git diff --cached --name-only | grep -q '^docs/'; then
            echo 'pages_changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pages_changed=false' >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'chore: social autopilot output [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      # Explicit deployment: GITHUB_TOKEN bot commits do NOT themselves trigger a Pages build.
      - name: Configure GitHub Pages
        if: steps.persist.outputs.pages_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
      - name: Upload public media site
        if: steps.persist.outputs.pages_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy public media site
        id: deploy
        if: steps.persist.outputs.pages_changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
