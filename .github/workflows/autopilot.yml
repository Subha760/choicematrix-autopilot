name: Manual VM command
on:
  workflow_dispatch:
    inputs:
      manual_action:
        description: Queue an action on the existing persistent VM worker
        required: true
        default: draft_now
        type: choice
        options: [draft_now, publish_now, auto, preflight]
permissions:
  contents: read
concurrency:
  group: autopilot-manual-command
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Queue command on the single state authority
        env:
          VM_HOST: ${{ secrets.AUTOPILOT_VM_HOST }}
          VM_USER: ${{ secrets.AUTOPILOT_VM_USER }}
          VM_DIR: ${{ secrets.AUTOPILOT_VM_DIR }}
          VM_SSH_KEY: ${{ secrets.AUTOPILOT_VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.AUTOPILOT_VM_KNOWN_HOSTS }}
          ACTION: ${{ inputs.manual_action }}
        shell: bash
        run: |
          set -euo pipefail
          case "$ACTION" in auto|draft_now|publish_now|preflight) ;; *) exit 2 ;; esac
          [[ "$VM_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$VM_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$VM_DIR" =~ ^/[a-zA-Z0-9_./-]+$ ]]
          [[ -n "$VM_SSH_KEY" && -n "$VM_KNOWN_HOSTS" ]]
          umask 077
          printf '%s\n' "$VM_SSH_KEY" > "$RUNNER_TEMP/autopilot-key"
          printf '%s\n' "$VM_KNOWN_HOSTS" > "$RUNNER_TEMP/autopilot-known-hosts"
          trap 'rm -f "$RUNNER_TEMP/autopilot-key" "$RUNNER_TEMP/autopilot-known-hosts"' EXIT
          if [[ "$ACTION" == preflight ]]; then
            command="cd '$VM_DIR' && .venv/bin/python autopilot.py --preflight --online"
          else
            command="cd '$VM_DIR' && .venv/bin/python autopilot.py --action '$ACTION'"
          fi
          ssh -o BatchMode=yes -o ConnectTimeout=20 -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/autopilot-known-hosts" \
            -i "$RUNNER_TEMP/autopilot-key" "$VM_USER@$VM_HOST" "$command"
